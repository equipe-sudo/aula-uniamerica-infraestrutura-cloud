    <title>Lista de Tarefas · Equipe SUDO</title>
    <script>
      /* tema antes da primeira pintura: evita o flash de claro/escuro */
      (function () {
        try {
          var salvo = window.localStorage.getItem('equipe-sudo:tema');
          var tema =
            salvo === 'light' || salvo === 'dark'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = tema;
        } catch (err) {
          /* sem storage: mantém o padrão escuro */
        }
      })();
    </script>
  </head>
