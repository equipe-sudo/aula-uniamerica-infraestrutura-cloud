name: Build & Push Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/equipe-sudo/equipe-sudo-frontend

jobs:
  build-and-push:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================================
      # Avisa o repositório de infraestrutura para fazer o deploy.
      # Sem CI_PAT configurado aqui, o passo apenas ignora (não quebra o build).
      # ==========================================================
      - name: Notificar repo de infraestrutura (deploy)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CI_PAT não configurado neste repositório — pulando o gatilho de deploy."
            echo "Adicione o secret CI_PAT para habilitar o deploy automático."
            exit 0
          fi
          gh api repos/equipe-sudo/infrastructure/dispatches \
            -f event_type=app-image-updated
          echo "Deploy disparado no repositório de infraestrutura."
